name: "CodeQL Analysis"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 * * 1" # Weekly on Monday at midnight UTC

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

      - name: Notify Slack of new alerts
        if: github.event_name == 'push'
        uses: actions/github-script@v7
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        with:
          script: |
            const webhookUrl = process.env.SLACK_WEBHOOK_URL;
            if (!webhookUrl) {
              core.info('SLACK_WEBHOOK_URL not set, skipping Slack notification');
              return;
            }

            // Query for alerts that were recently created on this ref
            let alerts = [];
            try {
              const response = await github.rest.codeScanning.listAlertsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: context.ref,
                state: 'open',
                sort: 'created',
                direction: 'desc',
                per_page: 10
              });
              alerts = response.data;
            } catch (error) {
              core.warning(`Failed to fetch code scanning alerts: ${error.message}`);
              return;
            }

            if (alerts.length === 0) {
              core.info('No open alerts found, skipping Slack notification');
              return;
            }

            const alertBlocks = alerts.map(alert => {
              const severity = alert.rule.security_severity_level || alert.rule.severity || 'unknown';
              const description = alert.rule.description || 'No description';
              const filePath = alert.most_recent_instance?.location?.path || 'unknown';
              const startLine = alert.most_recent_instance?.location?.start_line || 'N/A';
              const alertUrl = alert.html_url;
              return `- *[${severity.toUpperCase()}]* ${description}\n  File: \`${filePath}:${startLine}\`\n  <${alertUrl}|View Alert>`;
            }).join('\n');

            const payload = {
              text: `:warning: *CodeQL Security Alerts* for \`${context.repo.owner}/${context.repo.repo}\`\n\n${alertBlocks}`
            };

            const response = await fetch(webhookUrl, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });

            if (!response.ok) {
              core.warning(`Slack notification failed: ${response.status} ${response.statusText}`);
            } else {
              core.info('Slack notification sent successfully');
            }
